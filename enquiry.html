<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Enquiry - Ubuntu Coffee Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Ubuntu Coffee Shop</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <h2>Make an Enquiry</h2>

        <form>

            <label>Name:</label>
            <input type="text" name="name">

            <br><br>

            <label>Email:</label>
            <input type="email" name="email">

            <br><br>

            <label>Phone:</label>
            <input type="text" name="phone">

            <br><br>

            <label>Enquiry:</label>
            <br>

            <textarea name="enquiry" rows="5" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Submit">

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Ubuntu Coffee Shop</p>
    </footer>

</body>
